ی فارسی داخل بسته پروژه، مراحل Deploy و تنظیم کلیدها را توضیح می‌دهد.</div>`;
    return `<h3>پشتیبان‌گیری و انتقال داده</h3><p>داده‌ها فعلاً به‌صورت خودکار در مرورگر همین دستگاه ذخیره می‌شوند. برای جلوگیری از دست رفتن گزارش‌ها، نسخه پشتیبان بگیر.</p><div class="settings-section"><div class="inline-actions"><button class="btn btn-primary" data-action="export-data">⇩ دانلود نسخه پشتیبان JSON</button><label class="btn btn-outline" for="importFile">⇧ بازیابی نسخه پشتیبان</label><input id="importFile" type="file" accept="application/json" hidden /></div><p class="field-help" style="margin-top:12px">فایل پشتیبان شامل برنامه، نشست‌ها، ثبت تست‌ها، دفتر خطا و تنظیمات است. آن را در فضای خصوصی نگه دار.</p></div><div class="settings-section"><h3>مدیریت داده</h3><p>پاک‌کردن اطلاعات قابل بازگشت نیست. قبل از پاک‌سازی، فایل JSON بگیر.</p><button class="btn btn-danger btn-small" data-action="reset-data">بازنشانی داده‌های محلی</button></div>`;

  function weekChartData(){
    const base=new Date();base.setHours(12,0,0,0);const offset=(base.getDay()+6)%7;base.setDate(base.getDate()-offset);const days=[];for(let i=0;i<7;i++){const d=new Date(base);d.setDate(d.getDate()+i);const key=localDateKey(d);days.push({date:key,label:new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'short'}).format(d),minutes:studiedMinutes(key)});}return days;
  }
  function baseCoreBindPageEvents(){
    $$('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
    $$('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action,b.dataset.id,b)));
    $$('[data-tab]').forEach(b=>b.addEventListener('click',()=>{currentSettingsTab=b.dataset.tab;render();}));
    $$('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{const input=$('#chatInput');if(input){input.value=b.dataset.prompt;input.focus();}}));
    $('#chatForm')?.addEventListener('submit',sendChat);
    $('#reportDate')?.addEventListener('change',e=>{selectedReportDate=e.target.value;render();});
    $('#importFile')?.addEventListener('change',importBackup);
  }
  function baseCoreHandleAction(action,id,btn){
    switch(action){
      case 'start-next':{const d=dashboardDate();const e=eventsForDate(d).find(x=>isStudyEvent(x)&&!['completed','missed','inProgress'].includes(x.status))||nextPlannedEvent();if(e)startEvent(e.id);else openQuickAdd();break;}
      case 'start-event':startEvent(id);break;
      case 'pause-session':pauseSession();break;
      case 'resume-session':resumeSession();break;
      case 'add-time':addTime();break;
      case 'finish-session':openFinishModal();break;
      case 'toggle-focus':toggleFocus();break;
      case 'quick-add':openQuickAdd();break;
      case 'edit-event':openEventModal(id);break;
      case 'prev-week':currentWeek=0;render();break;
      case 'next-week':currentWeek=1;render();break;
      case 'open-report':selectedReportDate=dashboardDate();go('reports');break;
      case 'copy-report':copyReport();break;
      case 'download-report':downloadText(makeReport(selectedReportDate),`StudyOS-report-${selectedReportDate}.txt`);toast('گزارش دانلود شد.');break;
      case 'export-data':exportBackup();break;
      case 'add-error':openErrorModal();break;
      case 'resolve-error':resolveError(id);break;
      case 'edit-error':openErrorModal(id);break;
      case 'delete-error':deleteError(id);break;
      case 'save-settings':saveSettingsFromForm();break;
      case 'check-server':checkServer(true);break;
      case 'sync-now':syncWithCloudflare();break;
      case 'reset-data':resetData();break;
      case 'view-log':{const l=state.logs.find(x=>x.eventId===id);if(l)openLogModal(l);break;}
      default:break;
    }
  }
  function startEvent(id){
    if(state.activeSession){toast('یک نشست در حال اجراست؛ ابتدا آن را تمام یا متوقف کن.','error');go('room');return;}
    const e=state.events.find(x=>x.id===id);if(!e)return;
    const mins=durationMinutes(e)||state.settings.sessionLength||50;
    state.activeSession={id:uid(),eventId:e.id,title:e.title,detail:e.detail,subject:initialsSubject(e.subject||e.title),type:e.type,date:todayKey(),scheduledDate:e.date,createdAt:new Date().toISOString(),startedAt:Date.now(),accumulatedMs:0,paused:false,plannedMs:mins*60000,targetMs:mins*60000};
    saveState();go('room');toast('اتاق مطالعه شروع شد. تمرکزت رو حفظ کن.');
  }
  function startFreeSession(data){
    if(state.activeSession){toast('ابتدا نشست فعلی را تمام کن.','error');return;}
    const mins=Number(data.minutes)||state.settings.sessionLength||50;
    state.activeSession={id:uid(),eventId:null,title:data.title||`${data.subject} · مطالعه آزاد`,detail:data.detail||'',subject:data.subject||'مطالعه آزاد',type:data.type||'learn',date:todayKey(),scheduledDate:data.date||todayKey(),createdAt:new Date().toISOString(),startedAt:Date.now(),accumulatedMs:0,paused:false,plannedMs:mins*60000,targetMs:mins*60000};saveState();closeModal();go('room');toast('نشست آزاد شروع شد.');
  }
  function pauseSession(){const a=state.activeSession;if(!a||a.paused)return;a.accumulatedMs=elapsedMs(a);a.paused=true;a.pausedAt=Date.now();saveState();render();toast('تایمر متوقف شد.');}
  function resumeSession(){const a=state.activeSession;if(!a||!a.paused)return;a.paused=false;a.startedAt=Date.now();saveState();render();toast('تایمر ادامه پیدا کرد.');}
  function addTime(){const a=state.activeSession;if(!a)return;a.targetMs=(a.targetMs||a.plannedMs)+15*60000;saveState();render();toast('۱۵ دقیقه به زمان هدف اضافه شد.');}
  function openFinishModal(){
    const a=state.activeSession;if(!a)return;
    const elapsed=Math.max(1,Math.round(elapsedMs(a)/60000));
    openModal('ثبت نتیجه نشست',`<form id="finishForm"><div class="helper-box">${escapeHtml(a.title)} · زمان مفید ثبت‌شده: ${formatMinutes(elapsed)}. اگر فیلم دیدی، بخش تمرین و تست را هم جداگانه ثبت کن.</div><div class="form-grid" style="margin-top:14px"><div class="field"><label>وضعیت فعالیت</label><select id="finishStatus"><option value="completed">کامل انجام شد</option><option value="partial">بخشی انجام شد</option></select></div><div class="field"><label>میزان تسلط (۱ تا ۵)</label><select id="confidence"><option value="5">۵ · کاملاً مسلط</option><option value="4">۴ · خوب</option><option value="3" selected>۳ · متوسط</option><option value="2">۲ · نیاز به مرور</option><option value="1">۱ · ضعیف</option></select></div><div class="field"><label>تعداد تست / سؤال</label><input id="questions" type="number" min="0" value="0" /></div><div class="field"><label>پاسخ درست</label><input id="correct" type="number" min="0" value="0" /></div><div class="field"><label>پاسخ غلط</label><input id="wrong" type="number" min="0" value="0" /></div><div class="field"><label>تمرین تشریحی انجام‌شده</label><input id="written" type="number" min="0" value="0" /></div><div class="field full"><label>یادداشت / مبحث دشوار</label><textarea id="sessionNotes" placeholder="مثلاً مفهوم دامنه مثلثاتی هنوز نیاز به تمرین دارد..."></textarea></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-modal-close>ادامه مطالعه</button><button type="submit" class="btn btn-primary">ثبت نشست و پایان تایمر</button></div></form>`);
    $('#finishForm').addEventListener('submit',e=>{e.preventDefault();saveFinishedSession(elapsed);});
    $$('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));
  }
  function saveFinishedSession(fallbackMinutes){
    const a=state.activeSession;if(!a)return;
    const minutes=Math.max(1,Math.round(elapsedMs(a)/60000))||fallbackMinutes;
    const questions=Number($('#questions').value)||0,correct=Number($('#correct').value)||0,wrong=Number($('#wrong').value)||0,confidence=Number($('#confidence').value)||3,written=Number($('#written').value)||0,completed=$('#finishStatus').value==='completed',notes=$('#sessionNotes').value.trim();
    const log={id:uid(),eventId:a.eventId,title:a.title,subject:a.subject,type:a.type,date:todayKey(),scheduledDate:a.scheduledDate||a.date||todayKey(),minutes,questions,correct,wrong,written,confidence,completed,notes,startAt:a.createdAt,endAt:new Date().toISOString(),extraMinutes:Math.max(0,Math.round(((a.targetMs||a.plannedMs)-(a.plannedMs||0))/60000))};
    state.logs.push(log);
    if(a.eventId){const e=state.events.find(x=>x.id===a.eventId);if(e)e.status=completed?'completed':'partial';}
    if((confidence<=2||wrong>0||notes)&&!state.errors.some(x=>x.sourceLogId===log.id)){
      state.errors.push({id:uid(),title:a.title,subject:a.subject,note:notes||`در این نشست ${fa(wrong)} پاسخ غلط و تسلط ${fa(confidence)} از ۵ ثبت شد.`,source:'session',sourceLogId:log.id,createdAt:new Date().toISOString(),resolved:false});
    }
    state.activeSession=null;saveState();closeModal();$('#focusOverlay').classList.remove('show');go('analytics');toast('نشست ثبت شد؛ داده‌ها برای تحلیل ذخیره شدند.');
  }
  function openQuickAdd(){
    const subjectOptions=['حسابان','فیزیک','شیمی','هندسه','گسسته','آمار و احتمال','ادبیات','عربی','دینی','زبان','مرور ترکیبی','مطالعه آزاد'];
    openModal('شروع نشست آزاد',`<form id="quickForm"><div class="form-grid"><div class="field"><label>درس</label><select id="freeSubject">${subjectOptions.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>نوع فعالیت</label><select id="freeType"><option value="learn">آموزش / فیلم</option><option value="practice">تمرین تشریحی و تست</option><option value="recall">بازیابی و مرور</option><option value="general">مطالعه نهایی</option></select></div><div class="field full"><label>عنوان دقیق فعالیت</label><input id="freeTitle" placeholder="مثلاً تمرین معادلات مثلثاتی" required /></div><div class="field"><label>زمان هدف (دقیقه)</label><input id="freeMinutes" type="number" min="10" max="240" value="${state.settings.sessionLength}" /></div><div class="field"><label>تاریخ</label><input id="freeDate" type="date" value="${todayKey()}" /></div><div class="field full"><label>یادداشت (اختیاری)</label><textarea id="freeDetail" placeholder="هدف این نشست..."></textarea></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-modal-close>انصراف</button><button type="submit" class="btn btn-primary">شروع اتاق مطالعه</button></div></form>`);
    $('#quickForm').addEventListener('submit',e=>{e.preventDefault();startFreeSession({subject:$('#freeSubject').value,type:$('#freeType').value,title:$('#freeTitle').value.trim(),minutes:$('#freeMinutes').value,date:$('#freeDate').value,detail:$('#freeDetail').value.trim()});});$$('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));
  }
  function openEventModal(id){
    const old=state.events.find(x=>x.id===id);const e=old||{date:dashboardDate(),start:'16:00',end:'17:00',title:'',detail:'',type:'learn',subject:'حسابان'};
    openModal(old?'ویرایش فعالیت برنامه':'افزودن فعالیت به برنامه',`<form id="eventForm"><div class="form-grid"><div class="field"><label>عنوان فعالیت</label><input id="eventTitle" required value="${escapeAttr(e.title)}" /></div><div class="field"><label>درس / موضوع</label><input id="eventSubject" value="${escapeAttr(e.subject||'')}" /></div><div class="field"><label>تاریخ</label><input type="date" id="eventDate" value="${e.date}" required /></div><div class="field"><label>نوع فعالیت</label><select id="eventType">${Object.entries(typeLabels).filter(([k])=>k!=='exam').map(([k,v])=>`<option value="${k}" ${e.type===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>شروع</label><input type="time" id="eventStart" value="${en(e.start||'16:00')}" required /></div><div class="field"><label>پایان</label><input type="time" id="eventEnd" value="${en(e.end||'17:00')}" required /></div><div class="field full"><label>توضیحات</label><textarea id="eventDetail">${escapeHtml(e.detail||'')}</textarea></div></div><div class="modal-foot">${old?'<button type="button" id="deleteEvent" class="btn btn-danger">حذف</button>':''}<button type="button" class="btn btn-outline" data-modal-close>انصراف</button><button type="submit" class="btn btn-primary">ذخیره فعالیت</button></div></form>`);
    $('#eventForm').addEventListener('submit',ev=>{ev.preventDefault();const v={id:old?old.id:uid(),date:$('#eventDate').value,start:$('#eventStart').value,end:$('#eventEnd').value,title:$('#eventTitle').value.trim(),subject:$('#eventSubject').value.trim(),detail:$('#eventDetail').value.trim(),type:$('#eventType').value,status:old?.status||'planned'};if(v.type==='personal'&&/باشگاه/.test(v.title)&&new Date(v.date+'T12:00:00').getDay()===5){toast('جمعه روز تعطیلی باشگاه است.','error');return;}if(old)Object.assign(old,v);else state.events.push(v);saveState();closeModal();render();toast('برنامه ذخیره شد.');});
    $('#deleteEvent')?.addEventListener('click',()=>{if(confirm('این فعالیت حذف شود؟')){state.events=state.events.filter(x=>x.id!==id);saveState();closeModal();render();toast('فعالیت حذف شد.');}});$$('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));
  }
  function openErrorModal(id){const old=state.errors.find(x=>x.id===id);openModal(old?'ویرایش مورد مرور':'ثبت مورد جدید در دفتر خطا',`<form id="errorForm"><div class="form-grid"><div class="field"><label>درس</label><input id="errSubject" value="${escapeAttr(old?.subject||'حسابان')}" /></div><div class="field"><label>عنوان مبحث / خطا</label><input id="errTitle" value="${escapeAttr(old?.title||'')}" required /></div><div class="field full"><label>علت خطا یا نکته‌ای که باید مرور شود</label><textarea id="errNote">${escapeHtml(old?.note||'')}</textarea></div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-modal-close>انصراف</button><button type="submit" class="btn btn-primary">ذخیره</button></div></form>`);$('#errorForm').addEventListener('submit',e=>{e.preventDefault();const v={id:old?.id||uid(),subject:$('#errSubject').value.trim(),title:$('#errTitle').value.trim(),note:$('#errNote').value.trim(),source:'manual',createdAt:old?.createdAt||new Date().toISOString(),resolved:old?.resolved||false};if(old)Object.assign(old,v);else state.errors.push(v);saveState();closeModal();render();toast('مورد مرور ذخیره شد.');});$$('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));}
  function resolveError(id){const e=state.errors.find(x=>x.id===id);if(e){e.resolved=true;e.resolvedAt=new Date().toISOString();saveState();render();toast('به‌عنوان مرورشده ثبت شد.');}}

    return `پیامت رو دریافت کردم. در حالت محلی به داده‌های ثبت‌شده دسترسی دارم، اما برای توضیح تخصصی یک مبحث یا ساخت پاسخ محتوایی دقیق باید Gemini یا GPT به Worker متصل شود.\n\nداده فعلی: ${fa(all.length)} نشست، ${formatMinutes(total)} زمان مطالعه ثبت‌شده، ${fa(open.length)} مورد باز در دفتر خطا.\n\nمی‌تونی فعلاً از من بخوای گزارش روزانه، دفتر خطا یا روند مطالعه‌ات رو بر اساس همین داده‌ها جمع‌بندی کنم.`;
  }

function planProgress(){const items=state.events.filter(e=>isStudyEvent(e));if(!items.length)return 0;const value=items.reduce((sum,e)=>sum+(e.status==='completed'?1:e.status==='partial'?.5:0),0);return Math.round(value/items.length*100);}

}

function musicEmbedUrl(raw){
  if(!raw)return null;try{const u=new URL(raw);const host=u.hostname.replace(/^www\./,'');
    if(host==='open.spotify.com'){const path=u.pathname.replace(/^\/embed\//,'/');return `https://open.spotify.com/embed${path}${u.search||'?utm_source=generator'}`;}
    if(host==='youtu.be'){const id=u.pathname.split('/').filter(Boolean)[0];return id?`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0`:null;}
    if(['youtube.com','m.youtube.com','music.youtube.com'].includes(host)){if(u.pathname==='/watch'&&u.searchParams.get('v'))return `https://www.youtube-nocookie.com/embed/${encodeURIComponent(u.searchParams.get('v'))}?rel=0`;const match=u.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/);return match?`https://www.youtube-nocookie.com/embed/${encodeURIComponent(match[1])}?rel=0`:null;}
  }catch{}return null;
}

function findOpenSlot(afterDate,duration=45){
 const starts=['08:30','09:30','10:30','11:30','14:30','15:30','16:30','17:30','19:00','20:00'];
 for(let offset=1;offset<=35;offset++){const d=new Date(afterDate+'T12:00:00');d.setDate(d.getDate()+offset);const key=localDateKey(d),dow=d.getDay();
  for(const st of starts){const start=parseTime(st),end=start+duration;if(dow!==1&&dow!==5&&start<14*60+15)continue;
    // Fixed weekly commitments outside currently loaded plan.
    if(dow===0&&start<19*60&&end>15*60+30)continue; // Sunday: class + travel
    if(dow===2&&start<19*60&&end>14*60+30)continue; // Tuesday: physics class + travel
    if(dow===4&&start<21*60&&end>14*60+30)continue; // Thursday: geometry/discrete/chemistry
    if(state.settings.gymDays?.includes(dow)&&start<22*60&&end>20*60)continue;
    const overlaps=state.events.some(ev=>ev.date===key&&(ev.allDay||(()=>{const x=parseTime(ev.start),y=parseTime(ev.end);return x!==null&&y!==null&&start<y&&end>x;})()));
    if(!overlaps)return {date:key,start:st,end:`${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}`};
  }
 }
 return null;
}

 const created=[];let index=1,guard=0;
 while(left>0&&guard<10){guard++;const chunk=Math.min(45,left);const slot=findOpenSlot(todayKey(),chunk);if(!slot)break;const e={id:uid(),date:slot.date,start:slot.start,end:slot.end,title:`${source.title} · جبران ${fa(index)}`,detail:description||'بخش باقی‌مانده از فعالیت قبلی؛ این بار خروجی مشخص را کامل کن.',type:source.type||'practice',subject:source.subject||source.title,status:'planned',rescheduledFrom:source.eventId||source.id||null};state.events.push(e);created.push(e);left-=chunk;index++;}
 return created;
}

  const q='در نقش برنامه‌ریز آموزشی StudyOS، با توجه به درس‌ها و فعالیت‌های باقی‌مانده امروز، نشست‌های اخیر، میزان تسلط، خطاها و محدودیت‌های برنامه، فقط یک کار مشخص را به‌عنوان بهترین قدم بعدی پیشنهاد بده. زمان پیشنهادی، خروجی قابل اندازه‌گیری و دلیل را کوتاه بگو. خواب، کلاس‌ها، مدرسه و جمعه تعطیل باشگاه را دست‌نخورده نگه دار.';
  answerAI(q).then(ans=>{const el=$('#aiSuggestion');if(el)el.innerHTML=`<strong>پیشنهاد دستیار</strong>${escapeHtml(ans).replace(/\n/g,'<br/>')}`;}).catch(()=>{const el=$('#aiSuggestion');if(el)el.textContent=smartLocalSuggestion();});
}
function saveSettingsFromForm(){
  const k=$('#konkurDate')?.value||'',bi=$('#breakInterval')?.value,mb=$('#microBreakMinutes')?.value,music=$('#musicUrl')?.value;
  state.settings.konkurDate=k;
  if(bi)state.settings.breakInterval=Math.max(25,Math.min(120,Number(bi)||50));
  if(mb)state.settings.microBreakMinutes=Math.max(1,Math.min(10,Number(mb)||2));
  if(music!==undefined)state.settings.musicUrl=music.trim();
  baseSaveSettingsFromForm();
}
